services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: commonground-postgres
    environment:
      POSTGRES_DB: commonground
      POSTGRES_USER: commonground
      POSTGRES_PASSWORD: commonground
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: commonground-redis
    ports:
      - "6380:6379"

volumes:
  postgres_data: